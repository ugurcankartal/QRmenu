{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {% if groq_translate_url and default_language %}
    <li>
      <form method="post" action="{{ groq_translate_url }}" class="groq-translate-form">
        {% csrf_token %}
        <button type="submit" class="button groq-translate-button">
          Groq ile çevir ({{ default_language.name_native }})
        </button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
