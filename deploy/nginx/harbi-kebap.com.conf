# Install:
#   sudo cp deploy/nginx/harbi-kebap.com.conf /etc/nginx/sites-available/harbi-kebap.com
#   sudo ln -sf /etc/nginx/sites-available/harbi-kebap.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL sertifikasi zaten varsa bu dosya dogrudan kullanilir.
# Yoksa once HTTP blogu ile certbot calistirin, sonra bu dosyayi yukleyin.

upstream qrmenu_backend {
    server 127.0.0.1:${PROD_RUNSERVER_PORT};
}

server {
    listen 80;
    listen [::]:80;
    server_name harbi-kebap.com www.harbi-kebap.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harbi-kebap.com www.harbi-kebap.com;

    ssl_certificate /etc/letsencrypt/live/harbi-kebap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harbi-kebap.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    root /home/ubuntu/harbiqrmenu/Frontend/dist;
    index index.html;

    location /static/ {
        alias /home/ubuntu/harbiqrmenu/Backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/ubuntu/harbiqrmenu/Backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /robots.txt {
        proxy_pass http://qrmenu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /sitemap.xml {
        proxy_pass http://qrmenu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://qrmenu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://qrmenu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /ckeditor5/ {
        proxy_pass http://qrmenu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
